name: Scheduled jobs

# Runs cleanup/finalize jobs against the Railway API service.
# Required repository secrets: RAILWAY_TOKEN
# Optional: RAILWAY_SERVICE (defaults to the linked API service)
#
# Jobs are idempotent. Hourly is slightly more frequent than the Terraform
# EventBridge defaults for media/prompt checks and is safe.

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  railway-jobs:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Check Railway token
        id: secrets
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "RAILWAY_TOKEN is not set; skipping scheduled jobs."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.configured == 'true'
        with:
          node-version: "24"
      - name: Install Railway CLI
        if: steps.secrets.outputs.configured == 'true'
        run: npm install -g @railway/cli
      - name: Run jobs
        if: steps.secrets.outputs.configured == 'true'
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT }}
        run: |
          extra=()
          if [ -n "${RAILWAY_PROJECT_ID:-}" ]; then
            extra+=(--project "$RAILWAY_PROJECT_ID")
          fi
          if [ -n "${RAILWAY_ENVIRONMENT:-}" ]; then
            extra+=(--environment "$RAILWAY_ENVIRONMENT")
          fi
          if [ -n "${RAILWAY_SERVICE:-}" ]; then
            extra+=(--service "$RAILWAY_SERVICE")
          fi
          run_job() {
            echo "::group::$1"
            railway run "${extra[@]}" uv run python -m "$1"
            echo "::endgroup::"
          }
          run_job app.jobs.account_deletion
          run_job app.jobs.upload_cleanup
          run_job app.jobs.session_cleanup
          run_job app.jobs.idempotency_cleanup
          run_job app.jobs.deleted_media_cleanup
          run_job app.jobs.missing_prompt_check
