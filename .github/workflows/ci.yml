name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Repository checks
        run: make repo-checks

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install backend tooling
        run: make backend-install
      - name: Validate OpenAPI
        run: make api-validate
      - name: Ensure generated client is committed and fresh
        run: |
          if [ ! -d api/generated/ios ]; then
            echo "api/generated/ios missing; run make api-generate-ios and commit" >&2
            exit 1
          fi
          make api-check-generated

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: dailycreative
          POSTGRES_PASSWORD: dailycreative  # pragma: allowlist secret
          POSTGRES_DB: dailycreative
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dailycreative -d dailycreative"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://dailycreative:dailycreative@localhost:5432/dailycreative  # pragma: allowlist secret
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: dailycreative-ci-media
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_USE_SSL: "false"
    steps:
      - uses: actions/checkout@v7
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "MinIO failed to become healthy" >&2
          docker logs minio || true
          exit 1
      - name: Create MinIO bucket
        run: |
          docker run --rm --network host \
            -e MC_HOST_local=http://minioadmin:minioadmin@localhost:9000 \
            minio/mc:RELEASE.2025-08-13T08-35-41Z \
            mb --ignore-existing local/dailycreative-ci-media
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Install
        run: make backend-install
      - name: Lint
        run: make backend-lint
      - name: Typecheck
        run: make backend-typecheck
      - name: Test
        run: make backend-test
      - name: Apply migrations
        run: make db-migrate

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: make docker-build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0
      - name: Scan for secrets
        run: detect-secrets scan --baseline .secrets.baseline --exclude-files 'api/generated/.*|spec/stitch_daily_sketch_journal\.zip|\.env$'

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: make ios-generate
      - name: Prepare iOS Simulator
        id: sim
        run: |
          # macos-15 runners intermittently ship with no concrete simulators
          # (only the "Any iOS Simulator Device" placeholder). Recache and create
          # an iPhone device against the installed runtime when needed.
          xcrun simctl list >/dev/null || true
          python3 <<'PY'
          import json, os, subprocess, sys

          def run(*args: str) -> str:
              return subprocess.check_output(args, text=True)

          devices = json.loads(run("xcrun", "simctl", "list", "devices", "available", "-j"))["devices"]
          runtimes = json.loads(run("xcrun", "simctl", "list", "runtimes", "-j"))["runtimes"]

          def pick_iphone() -> str | None:
              preferred = ("iPhone 16", "iPhone 16 Pro", "iPhone 15", "iPhone 15 Pro")
              for runtime, sims in devices.items():
                  if "iOS" not in runtime:
                      continue
                  by_name = {
                      sim["name"]: sim["udid"]
                      for sim in sims
                      if sim.get("isAvailable", True) and "iPhone" in sim.get("name", "")
                  }
                  for name in preferred:
                      if name in by_name:
                          return by_name[name]
                  if by_name:
                      return next(iter(by_name.values()))
              return None

          udid = pick_iphone()
          if not udid:
              ios_runtimes = [
                  rt for rt in runtimes
                  if rt.get("isAvailable") and "iOS" in rt.get("name", "")
              ]
              if not ios_runtimes:
                  print("No iOS simulator runtimes installed", file=sys.stderr)
                  sys.exit(1)
              runtime = sorted(ios_runtimes, key=lambda rt: rt.get("version", ""), reverse=True)[0]
              device_types = json.loads(run("xcrun", "simctl", "list", "devicetypes", "-j"))["devicetypes"]
              preferred_types = (
                  "com.apple.CoreSimulator.SimDeviceType.iPhone-16",
                  "com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro",
                  "com.apple.CoreSimulator.SimDeviceType.iPhone-15",
                  "com.apple.CoreSimulator.SimDeviceType.iPhone-15-Pro",
              )
              type_ids = {dt["identifier"] for dt in device_types}
              device_type = next((t for t in preferred_types if t in type_ids), None)
              if device_type is None:
                  iphones = [dt for dt in device_types if "iPhone" in dt.get("name", "")]
                  if not iphones:
                      print("No iPhone device types available", file=sys.stderr)
                      sys.exit(1)
                  device_type = iphones[0]["identifier"]
              udid = run(
                  "xcrun", "simctl", "create", "CI iPhone", device_type, runtime["identifier"]
              ).strip()
              print(f"Created simulator {udid} ({device_type} / {runtime['identifier']})")

          print(f"Using simulator {udid}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"udid={udid}\n")
          PY
      - name: Build DailySketch for simulator
        run: |
          xcodebuild \
            -project ios/DailySketch.xcodeproj \
            -scheme DailySketch \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug-Local \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Build DailyStory for simulator
        run: |
          xcodebuild \
            -project ios/DailySketch.xcodeproj \
            -scheme DailyStory \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug-Local \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: DailySketch unit tests
        run: |
          xcodebuild \
            -project ios/DailySketch.xcodeproj \
            -scheme DailySketch \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug-Local \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:DailySketchTests \
            test
