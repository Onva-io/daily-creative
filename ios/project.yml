name: DailySketch
options:
  bundleIdPrefix: com.codebrewery.dailycreatives
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "16.0"
  defaultConfig: Debug-Local
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: "0.1.0"
    GENERATE_INFOPLIST_FILE: YES
configs:
  Debug-Local: debug
  Debug-Development: debug
  Release-Staging: release
  Release-Production: release
packages:
  DailyCreativeAPI:
    path: ../api/generated/ios
  DescopeKit:
    url: https://github.com/descope/descope-swift
    from: 0.9.0
  Sentry:
    path: Packages/SentryCocoa

# ---------------------------------------------------------------------------
# Adding an app
#
# 1. Create `<App>/` with `<App>App.swift`, `<App>Module.swift` (a
#    `CreativeModule`) and `Resources/` (Info.plist, entitlements, assets,
#    PrivacyInfo.xcprivacy) — copy DailyStory/Resources as a starting point.
# 2. Add a target below with `templates: [CreativeApp]` and fill in the
#    branding settings + app group. Add usage-description keys only if the
#    app needs camera / photos / location.
# 3. Add four schemes with `templates: [CreativeAppScheme]`, then run
#    `make ios-generate`.
#
# Everything under DailyCreative/ is shared and compiled into every app.
# Environment values come from Config/Environments/<Configuration>.xcconfig.
# ---------------------------------------------------------------------------
targetTemplates:
  CreativeApp:
    type: application
    platform: iOS
    sources:
      - path: ${target_name}
      - path: DailyCreative
    info:
      path: ${target_name}/Resources/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        API_BASE_URL: $(API_BASE_URL)
        APP_ENVIRONMENT: $(APP_ENVIRONMENT)
        DESCOPE_PROJECT_ID: $(DESCOPE_PROJECT_ID)
        SUPPORT_URL: $(SUPPORT_URL)
        SUPPORT_EMAIL: $(SUPPORT_EMAIL)
        PRIVACY_URL: $(PRIVACY_URL)
        TERMS_URL: $(TERMS_URL)
        COMMUNITY_GUIDELINES_URL: $(COMMUNITY_GUIDELINES_URL)
        SENTRY_DSN: $(SENTRY_DSN)
        SHOW_ENVIRONMENT_BADGE: $(SHOW_ENVIRONMENT_BADGE)
        ANALYTICS_ENVIRONMENT: $(ANALYTICS_ENVIRONMENT)
        BRAND_NAME: $(BRAND_NAME)
        CREATIVE_TYPE_ID: $(CREATIVE_TYPE_ID)
        COMMUNITY_TITLE: $(COMMUNITY_TITLE)
        START_ACTION_TITLE: $(START_ACTION_TITLE)
        REQUIRES_CAMERA: $(REQUIRES_CAMERA)
        DAILY_REMINDER_NOTIFICATION_ID: $(DAILY_REMINDER_NOTIFICATION_ID)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    configFiles:
      Debug-Local: Config/Environments/Debug-Local.xcconfig
      Debug-Development: Config/Environments/Debug-Development.xcconfig
      Release-Staging: Config/Environments/Release-Staging.xcconfig
      Release-Production: Config/Environments/Release-Production.xcconfig
    preBuildScripts:
      - name: Check Release Config
        script: |
          "$SRCROOT/../scripts/check-ios-config.sh" "$CONFIGURATION"
        basedOnDependencyAnalysis: false
    entitlements:
      path: ${target_name}/Resources/${target_name}.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    dependencies:
      - package: DailyCreativeAPI
      - package: DescopeKit
      - package: Sentry
    settings:
      base:
        PRODUCT_NAME: ${target_name}
        INFOPLIST_FILE: ${target_name}/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 547PA5L58A
        PROVISIONING_PROFILE_SPECIFIER: ""

targets:
  DailySketch:
    templates: [CreativeApp]
    info:
      properties:
        NSCameraUsageDescription: Daily Sketch uses the camera so you can photograph your drawing and share it with the community.
        NSPhotoLibraryUsageDescription: Daily Sketch accesses your photo library so you can choose an existing sketch photo to review and share.
    entitlements:
      properties:
        com.apple.security.application-groups:
          - group.com.codebrewery.dailycreatives.sketch
    settings:
      base:
        APP_BUNDLE_ID_BASE: com.codebrewery.dailycreatives.sketch
        BRAND_NAME: Daily Sketch
        CREATIVE_TYPE_ID: sketch
        COMMUNITY_TITLE: Community Sketches
        START_ACTION_TITLE: Start Sketch
        REQUIRES_CAMERA: "YES"
        DAILY_REMINDER_NOTIFICATION_ID: daily-sketch.daily-reminder

  DailyStory:
    templates: [CreativeApp]
    entitlements:
      properties:
        com.apple.security.application-groups:
          - group.com.codebrewery.dailycreatives.story
    settings:
      base:
        APP_BUNDLE_ID_BASE: com.codebrewery.dailycreatives.story
        BRAND_NAME: Daily Story
        CREATIVE_TYPE_ID: story
        COMMUNITY_TITLE: Community Stories
        START_ACTION_TITLE: Start Writing
        REQUIRES_CAMERA: "NO"
        DAILY_REMINDER_NOTIFICATION_ID: daily-story.daily-reminder

  DailyPhoto:
    templates: [CreativeApp]
    info:
      properties:
        NSCameraUsageDescription: Daily Photo uses the camera so you can take today’s photo and share it with the community.
        NSPhotoLibraryUsageDescription: Daily Photo accesses your photo library so you can choose an existing photo to review and share.
        NSLocationWhenInUseUsageDescription: Daily Photo uses your location only to suggest where a photo was taken. You can change or remove it, and exact coordinates are shared only if you turn that on for a post.
    entitlements:
      properties:
        com.apple.security.application-groups:
          - group.com.codebrewery.dailycreatives.photo
    settings:
      base:
        APP_BUNDLE_ID_BASE: com.codebrewery.dailycreatives.photo
        BRAND_NAME: Daily Photo
        CREATIVE_TYPE_ID: photo
        COMMUNITY_TITLE: Community Photos
        START_ACTION_TITLE: Take Photo
        REQUIRES_CAMERA: "YES"
        DAILY_REMINDER_NOTIFICATION_ID: daily-photo.daily-reminder

  # Shared-code unit tests run against the Daily Sketch host.
  DailySketchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DailySketchTests
    dependencies:
      - target: DailySketch
    configFiles:
      Debug-Local: Config/Environments/Debug-Local.xcconfig
      Debug-Development: Config/Environments/Debug-Development.xcconfig
      Release-Staging: Config/Environments/Release-Staging.xcconfig
      Release-Production: Config/Environments/Release-Production.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codebrewery.dailycreatives.sketch.dev.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DailySketch.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/DailySketch"
        BUNDLE_LOADER: "$(TEST_HOST)"
  # Photo-only logic (location seeding, sharing, payload) against the Daily Photo host.
  DailyPhotoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DailyPhotoTests
    dependencies:
      - target: DailyPhoto
    configFiles:
      Debug-Local: Config/Environments/Debug-Local.xcconfig
      Debug-Development: Config/Environments/Debug-Development.xcconfig
      Release-Staging: Config/Environments/Release-Staging.xcconfig
      Release-Production: Config/Environments/Release-Production.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codebrewery.dailycreatives.photo.dev.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DailyPhoto.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/DailyPhoto"
        BUNDLE_LOADER: "$(TEST_HOST)"
  DailySketchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DailySketchUITests
    dependencies:
      - target: DailySketch
    configFiles:
      Debug-Local: Config/Environments/Debug-Local.xcconfig
      Debug-Development: Config/Environments/Debug-Development.xcconfig
      Release-Staging: Config/Environments/Release-Staging.xcconfig
      Release-Production: Config/Environments/Release-Production.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codebrewery.dailycreatives.sketch.dev.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DailySketch

schemeTemplates:
  CreativeAppScheme:
    build:
      targets:
        ${appTarget}: all
    run:
      config: ${runConfig}
    test:
      config: ${runConfig}
    analyze:
      config: ${runConfig}
    profile:
      config: ${archiveConfig}
    archive:
      config: ${archiveConfig}

schemes:
  DailySketch:
    build:
      targets:
        DailySketch: all
        DailySketchTests: [test]
        DailySketchUITests: [test]
    run:
      config: Debug-Local
    test:
      config: Debug-Local
      targets:
        - DailySketchTests
        - DailySketchUITests
    analyze:
      config: Debug-Local
    profile:
      config: Release-Production
    archive:
      config: Release-Production
  DailySketch Development:
    templates: [CreativeAppScheme]
    templateAttributes:
      appTarget: DailySketch
      runConfig: Debug-Development
      archiveConfig: Release-Staging
  DailySketch Staging:
    templates: [CreativeAppScheme]
    templateAttributes:
      appTarget: DailySketch
      runConfig: Release-Staging
      archiveConfig: Release-Staging
  DailySketch Production:
    templates: [CreativeAppScheme]
    templateAttributes:
      appTarget: DailySketch
      runConfig: Release-Production
      archiveConfig: Release-Production

  DailyStory:
    templates: [CreativeAppScheme]
    templateAttributes:
      appTarget: DailyStory
      runConfig: Debug-Local
      archiveConfig: Release-Production
  DailyStory Development:
    templates: [CreativeAppScheme]
    templateAttributes:
      appTarget: DailyStory
      runConfig: Debug-Development
      archiveConfig: Release-Staging
  DailyStory Staging:
    templates: [CreativeAppScheme]
    templateAttributes:
      appTarget: DailyStory
      runConfig: Release-Staging
      archiveConfig: Release-Staging
  DailyStory Production:
    templates: [CreativeAppScheme]
    templateAttributes:
      appTarget: DailyStory
      runConfig: Release-Production
      archiveConfig: Release-Production

  DailyPhoto:
    build:
      targets:
        DailyPhoto: all
        DailyPhotoTests: [test]
    run:
      config: Debug-Local
    test:
      config: Debug-Local
      targets:
        - DailyPhotoTests
    analyze:
      config: Debug-Local
    profile:
      config: Release-Production
    archive:
      config: Release-Production
  DailyPhoto Development:
    templates: [CreativeAppScheme]
    templateAttributes:
      appTarget: DailyPhoto
      runConfig: Debug-Development
      archiveConfig: Release-Staging
  DailyPhoto Staging:
    templates: [CreativeAppScheme]
    templateAttributes:
      appTarget: DailyPhoto
      runConfig: Release-Staging
      archiveConfig: Release-Staging
  DailyPhoto Production:
    templates: [CreativeAppScheme]
    templateAttributes:
      appTarget: DailyPhoto
      runConfig: Release-Production
      archiveConfig: Release-Production
